<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aegisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C1123F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#050608" />
  <!-- Futuristic Shield Outline -->
  <path d="M50 14 L82 28 L82 56 C82 74 68 88 50 94 C32 88 18 74 18 56 L18 28 Z" stroke="url(#aegisGrad)" stroke-width="3.5" fill="rgba(11,15,20,0.8)" filter="url(#glow)"/>
