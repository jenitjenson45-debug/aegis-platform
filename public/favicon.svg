  <path d="M50 26 L70 38 L50 78 L30 38 Z" fill="none" stroke="#2563FF" stroke-width="2.5" />
  <circle cx="50" cy="46" r="6" fill="#C1123F" filter="url(#glow)" />
  <circle cx="50" cy="46" r="3" fill="#FFFFFF" />
</svg>
